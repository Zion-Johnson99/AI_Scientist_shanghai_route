[project]
name = "weather-api-data"
version = "0.1.0"
description = "徐汇和风天气与多源环境数据接入模块"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.scripts]
weather-api-data = "weather_api_data.cli:console_main"

[project.optional-dependencies]
chap = [
  "geopandas>=1.0,<2",
  "h5py>=3.12,<4",
  "h5netcdf>=1.6,<2",
  "numpy>=1.26,<2.4",
  "shapely>=2.0,<3",
  "xarray>=2025.1,<2025.7",
]
dev = [
  "pyright>=1.1.411",
  "pytest>=8.0",
  "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "RUF", "TRY"]
ignore = [
  "RUF001",
  "TRY003",
  "TRY301",
]

[tool.ruff.lint.isort]
known-first-party = ["weather_api_data"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
