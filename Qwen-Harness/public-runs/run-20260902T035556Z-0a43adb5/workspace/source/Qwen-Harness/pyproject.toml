[project]
name = "qwen-harness"
version = "0.1.0"
description = "Qwen-Harness: structured research orchestration CLI for multi-source environmental health route decision experiments"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Qwen-Harness Team" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
qwen-harness = "qwen_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
