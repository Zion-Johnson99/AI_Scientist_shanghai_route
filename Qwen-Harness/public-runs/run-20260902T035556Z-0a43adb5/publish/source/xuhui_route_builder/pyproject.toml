[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xuhui-route-builder"
version = "0.1.0"
description = "Xuhui district route builder: 90 curated walking, running and cycling routes with validation, GeoJSON export and web map integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
xuhui-route-builder = "xuhui_route_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xuhui_route_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
