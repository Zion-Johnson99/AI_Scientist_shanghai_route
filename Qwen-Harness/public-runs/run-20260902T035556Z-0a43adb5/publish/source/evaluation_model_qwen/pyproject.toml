[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation-model-qwen"
version = "0.1.0"
description = "Multi-source personalized health route evaluation with Qwen integration"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.100.0,<1.0",
    "uvicorn[standard]>=0.23.0,<1.0",
    "httpx>=0.24.0,<1.0",
    "click>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[project.scripts]
evaluation-model-qwen = "evaluation_model_qwen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_model_qwen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
