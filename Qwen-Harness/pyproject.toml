[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-harness"
version = "0.1.0"
description = "Qwen AI Scientist harness for multisource healthy route research"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "pypdf>=6.0,<7",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyright>=1.1.411",
  "ruff>=0.16.3",
]

[project.scripts]
qwen-harness = "qwen_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "RUF", "TRY"]
ignore = ["RUF001", "RUF002", "RUF003", "TRY003", "TRY301"]

[tool.ruff.lint.isort]
known-first-party = ["qwen_harness"]

[tool.pyright]
include = ["tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateUsage = false
