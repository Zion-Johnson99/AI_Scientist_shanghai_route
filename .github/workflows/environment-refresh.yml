name: Environment Refresh

on:
  schedule:
    # Cloudflare triggers the primary weather refresh at :00/:15/:30/:45.
    # GitHub cron is the independent backup at :10/:25/:40/:55, hourly at :05,
    # and daily at 06:07 (22:07 UTC on the previous date).
    - cron: "10,25,40,55 * * * *"
    - cron: "5 * * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Refresh tier
        required: true
        default: hourly
        type: choice
        options:
          - weather
          - hourly
          - daily
      deploy_pages:
        description: Deploy the generated artifact to GitHub Pages
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: environment-refresh
  cancel-in-progress: false

jobs:
  refresh-and-build:
    name: Refresh environment data and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QWEATHER_ENABLED: "true"
      QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
      QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
      POLLEN_ENABLED: ${{ secrets.POLLEN_API_KEY != '' && 'true' || 'false' }}
      POLLEN_API_KEY: ${{ secrets.POLLEN_API_KEY }}
      SHANGHAI_NOISE_ENABLED: ${{ secrets.SHANGHAI_NOISE_TOKEN != '' && 'true' || 'false' }}
      SHANGHAI_NOISE_TOKEN: ${{ secrets.SHANGHAI_NOISE_TOKEN }}
      AMAP_JS_API_KEY: ${{ secrets.AMAP_JS_API_KEY }}
      AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
      TENCENT_SEARCH_KEY: ${{ secrets.TENCENT_SEARCH_KEY }}
      RECOMMENDATION_API_BASE_URL: ${{ vars.RECOMMENDATION_API_BASE_URL }}
      ENVIRONMENT_DASHBOARD_URL: ${{ vars.ENVIRONMENT_DASHBOARD_URL }}
      ENVIRONMENT_PUBLISH_TOKEN: ${{ secrets.ENVIRONMENT_PUBLISH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate online publish configuration
        shell: bash
        run: |
          if [[ "$ENVIRONMENT_DASHBOARD_URL" != https://* ]]; then
            echo "ENVIRONMENT_DASHBOARD_URL must be configured as an HTTPS repository variable" >&2
            exit 1
          fi
          if [[ -z "$ENVIRONMENT_PUBLISH_TOKEN" ]]; then
            echo "ENVIRONMENT_PUBLISH_TOKEN repository secret is missing" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --directory weather_api_data --frozen --extra chap
          uv sync --directory xuhui_route_builder --frozen

      - name: Restore environment runtime
        uses: actions/cache/restore@v4
        with:
          path: weather_api_data/runtime
          key: environment-runtime-${{ github.run_id }}
          restore-keys: |
            environment-runtime-

      - name: Resolve refresh tier
        id: refresh-tier
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tier="${{ inputs.tier }}"
          else
            case "${{ github.event.schedule }}" in
              "10,25,40,55 * * * *") tier="weather" ;;
              "5 * * * *") tier="hourly" ;;
              "7 22 * * *") tier="daily" ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      - name: Bootstrap complete environment runtime
        if: ${{ steps.refresh-tier.outputs.tier != 'daily' }}
        shell: bash
        run: |
          required=(
            environment_latest.json
            environment_hourly.json
            grid_environment_latest.json
            pm25_grid_latest.json
            pollen_grid_scores.json
            noise_segments.json
            route_environment.json
          )
          for file in "${required[@]}"; do
            if [[ ! -f "weather_api_data/runtime/exports/$file" ]]; then
              uv run --directory weather_api_data --frozen --extra chap \
                weather-api-data --root "$GITHUB_WORKSPACE/weather_api_data" \
                scheduled-refresh --tier daily
              break
            fi
          done

      - name: Run selected refresh tier
        run: >-
          uv run --directory weather_api_data --frozen --extra chap
          weather-api-data --root "$GITHUB_WORKSPACE/weather_api_data"
          scheduled-refresh --tier "${{ steps.refresh-tier.outputs.tier }}"

      - name: Publish last-known-good environment dashboard
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 \
            --request POST \
            --header "Authorization: Bearer $ENVIRONMENT_PUBLISH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @xuhui_route_builder/data/web/environment_dashboard.json \
            "$ENVIRONMENT_DASHBOARD_URL"

      - name: Save environment runtime
        if: ${{ always() && hashFiles('weather_api_data/runtime/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: weather_api_data/runtime
          key: environment-runtime-${{ github.run_id }}

      - name: Generate browser map configuration
        run: >-
          uv run --directory xuhui_route_builder --frozen
          python -m xuhui_route_builder.web_map_config
          --from-environment
          --web-root "$GITHUB_WORKSPACE/xuhui_route_builder/web"

      - name: Build Pages artifact tree
        shell: bash
        run: |
          test -f xuhui_route_builder/web/index.html
          test -f xuhui_route_builder/pages-index.html
          test -f xuhui_route_builder/data/web/environment_dashboard.json
          mkdir -p pages-artifact/web pages-artifact/data/web
          cp xuhui_route_builder/pages-index.html pages-artifact/index.html
          cp -R xuhui_route_builder/web/. pages-artifact/web/
          cp -R xuhui_route_builder/data/web/. pages-artifact/data/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    name: Deploy Pages artifact
    if: ${{ github.event_name == 'schedule' || inputs.deploy_pages }}
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
