name: Deploy Xuhui route map to Pages

on:
  push:
    branches: [zjx_route]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "xuhui_route_builder/web/**"
      - "xuhui_route_builder/data/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        env:
          AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
          AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
        run: |
          test -n "$AMAP_JS_KEY"
          test -n "$AMAP_JS_SECURITY_CODE"
          mkdir -p _site/web _site/data/web
          cp -R xuhui_route_builder/web/. _site/web/
          cp -R xuhui_route_builder/data/web/. _site/data/web/
          printf 'window.XUHUI_AMAP_JS_KEY = "%s";\nwindow.XUHUI_AMAP_JS_SECURITY_CODE = "%s";\n' \
            "$AMAP_JS_KEY" "$AMAP_JS_SECURITY_CODE" > _site/web/local-amap-config.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
